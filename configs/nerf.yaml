# Novel view synthesis: fit each model to one Blender scene under FINER's
# protocol (torch-ngp --downscale 4 --trainskip 4), for 25,000 steps.
#
# Each model gives the inro class and constructor arguments of the
# density network, and training arguments that override the shared ones; all
# models share the radiance field's colour network and renderer. "deviation"
# marks a departure from the authors' published settings. Every learning rate
# is the best of the grid {1e-4, 3e-4, ..., 3e-1} on the validation views of
# lego and drums, and every model trains with PyTorch's default Adam.
#
# Every model has about 74k parameters, the colour network included: each
# baseline is the smallest of its kind that reaches 74,131, and FUTON has
# K = 100 components per axis, half the views' 200 pixels, a one-layer MLP
# decoder 64 wide and the largest CP rank, a multiple of 5, that keeps it
# smaller than every baseline (RFF, 74,459): 180 (73,027). Its components and
# width come from configs/ablation-futon/components_width_nerf.yaml, the best
# validation PSNR among the configurations that train and render fastest and
# in the least memory. Samples do not lie on a grid, so FUTON reads its basis
# from a table of 2048 points per axis (grid_size), each coordinate rounded to
# the nearest, 0.001 apart, finer than the marching step.

data:
  downsample: 4  # 200x200 views (torch-ngp --downscale)
  train_skip: 4  # 25 of the 100 train views (torch-ngp --trainskip)
  val_skip: 25  # 4 validation views for the learning curve

field:
  geometry_features: 15
  direction_encoding: sh
  color_net: [mlp, {hidden_features: 64, hidden_layers: 2}]

train:
  num_steps: 25000  # deviation: torch-ngp's --iter is 37500
  num_rays: 4096  # torch-ngp --num_rays
  max_samples_per_ray: 1024  # torch-ngp --max_steps
  color_lr: null  # the shared colour network's rate; null keeps each model's
  log_interval: 100
  eval_interval: 2500
  seed: 0

render_views: [0, 55]  # test views saved as images

models:
  RFF:
    class: RFF
    kwargs:
      hidden_features: 180
      hidden_layers: 2
      num_frequencies: 90
      sigma: 2.0  # tuned
    train: {lr: 3.0e-3}

  PE-MLP:
    class: PEMLP
    kwargs:
      hidden_features: 166
      hidden_layers: 3
      num_frequencies: 10
    train: {lr: 1.0e-2}

  MFN:  # GaborNet (Fathony et al., ICLR 2021)
    class: MFN
    kwargs:
      hidden_features: 176
      hidden_layers: 3
      input_scale: 128.0  # deviation: tuned; 256 in the reference
      alpha: 2.0  # deviation: tuned; 6 in the reference
      beta: 1.0
      weight_scale: 1.0
    train: {lr: 1.0e-2}

  SIREN:
    class: SIREN
    kwargs:
      hidden_features: 180
      hidden_layers: 3
      omega: 30.0
    train: {lr: 3.0e-4}

  FreSh:  # Kania et al. (ICLR 2025): the SIREN above, its first omega chosen per scene
    class: SIREN
    fresh: {size: 32}  # FreSh's spectrum shells for SIREN radiance fields
    kwargs:
      hidden_features: 180
      hidden_layers: 3
      omega: 30.0  # the later layers; FreSh picks the first one's
    train: {lr: 3.0e-4}

  Gauss:
    class: Gauss
    kwargs:
      hidden_features: 180
      hidden_layers: 3
      scale: 30.0
    train: {lr: 1.0e-3}

  WIRE:
    class: RealWIRE
    kwargs:
      hidden_features: 180
      hidden_layers: 3
      omega: 20.0
      scale: 10.0
    train: {lr: 1.0e-3}

  FINER:
    class: FINER
    kwargs:
      hidden_features: 180
      hidden_layers: 3
      omega: 30.0
    train: {lr: 3.0e-4}

  Instant-NGP:  # instant-ngp density network, paper hash grid
    class: InstantNGP
    kwargs:
      num_levels: 16
      features_per_level: 2
      log2_hashmap_size: 11
      base_resolution: 16
      max_resolution: 2048
      hidden_features: 64
      hidden_layers: 1
    train: {lr: 3.0e-2}  # deviation: 1e-2 in torch-ngp

  TensoRF-CP:
    class: TensoRF
    kwargs:
      rank: 56
      resolution: 256
      mode: cp
      hidden_features: 128
      hidden_layers: 2
    train: {lr: 1.0e-2}

  TensoRF-VM:
    class: TensoRF
    kwargs:
      rank: 14
      resolution: 32
      mode: vm
      hidden_features: 128
      hidden_layers: 2
    train: {lr: 3.0e-2}

  GA-Planes:
    class: GAPlanes
    kwargs:
      resolution: [128, 32, 4]
      features: 12
      hidden_features: 128
      hidden_layers: 2
    train: {lr: 3.0e-2}

  F-INR:  # Vemuri et al. (WACV 2026): SIREN axes and CP
    class: FINR
    kwargs:
      # deviation: SIREN axes, as on every task, where its paper fits radiance
      # fields with per-axis hash grids; width and rank tuned at the budget
      rank: 39
      hidden_features: 32
      hidden_layers: 3
      mode: cp
      grid: false  # samples along rays are scattered
    train: {lr: 1.0e-3}

  FUTON-sinc:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: 100, grid_size: 2048}]
      combiner: [cp, {rank: 180}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 64}]
    train: {lr: 1.0e-2}

  FUTON-cosine:
    class: FUTON
    kwargs:
      basis: [cosine, {num_components: 100, grid_size: 2048}]
      combiner: [cp, {rank: 180}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 64}]
    train: {lr: 1.0e-2}
