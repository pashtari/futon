# Image representation: fit each model to one Kodak image.
#
# Each model gives a neurofield class, its constructor arguments, and training
# arguments that override the shared ones; arguments may be expressions in the
# image height H and width W. "deviation" marks a departure from the authors'
# published settings. Every learning rate is the best of the grid {1e-4, 3e-4,
# ..., 3e-1} on two images, and every model trains with PyTorch's default Adam.
#
# Every model has about 197k parameters: each baseline is the smallest of its
# kind that reaches 197,123, and FUTON, with K = (H / 2, W / 2) components and
# a one-layer MLP decoder 64 wide, takes the largest CP rank, a multiple of 5,
# that keeps it smaller than every baseline (F-INR, 198,806): 280 (197,379).

data:
  subsample: 1.0  # the whole image at every step

train:
  num_steps: 1000
  log_interval: 50
  eval_interval: 50
  seed: 0

models:
  RFF:  # Tancik et al. (NeurIPS 2020), 2D image regression
    class: RFF
    kwargs:
      hidden_features: 212
      hidden_layers: 3
      num_frequencies: 256
      sigma: 10.0  # deviation: tuned; Tancik's 10 on [0, 1] coordinates is 5 here
      output_activation: tanh
    train: {lr: 3.0e-3}

  PE-MLP:  # FINER image benchmark
    class: PEMLP
    kwargs:
      hidden_features: 256
      hidden_layers: 4
      num_frequencies: 10
      output_activation: tanh
    train: {lr: 3.0e-3}

  MFN:  # GaborNet (Fathony et al., ICLR 2021)
    class: MFN
    kwargs:
      hidden_features: 256
      hidden_layers: 4
      # deviation: tuned; the official input_scale 256 and alpha 6 suit 256 x 256 images
      input_scale: 1024.0
      alpha: 1.25
      beta: 0.125
      weight_scale: 1.0
      output_activation: tanh
    train: {lr: 3.0e-2}

  SIREN:  # FINER image benchmark
    class: SIREN
    kwargs:
      hidden_features: 256
      hidden_layers: 4
      omega: 30.0
      output_activation: tanh
    train: {lr: 1.0e-3}

  FreSh:  # Kania et al. (ICLR 2025): the SIREN above, its first omega chosen per image
    class: SIREN
    fresh: {size: 64}  # FreSh's spectrum shells for images
    kwargs:
      hidden_features: 256
      hidden_layers: 4
      omega: 30.0  # the later layers; FreSh picks the first one's
      output_activation: tanh
    train: {lr: 1.0e-3}

  Gauss:  # FINER image benchmark
    class: Gauss
    kwargs:
      hidden_features: 256
      hidden_layers: 4
      scale: 30.0
      output_activation: tanh
    train: {lr: 3.0e-3}  # the grid's rate nearest the published 5e-3

  WIRE:  # FINER image benchmark, real Gabor layer
    class: RealWIRE
    kwargs:
      hidden_features: 256
      hidden_layers: 4
      omega: 20.0
      scale: 10.0
      output_activation: tanh
    train: {lr: 3.0e-3}  # deviation: the official 5e-3 diverges for the real Gabor layer

  FINER:  # FINER image benchmark
    class: FINER
    kwargs:
      hidden_features: 256
      hidden_layers: 4
      omega: 30.0
      output_activation: tanh
    train: {lr: 1.0e-3}

  Instant-NGP:  # instant-ngp configs/image/base.json
    class: InstantNGP
    kwargs:
      num_levels: 20  # deviation: 16 in the reference; 20 meet the budget
      features_per_level: 2
      log2_hashmap_size: 13
      base_resolution: 16
      max_resolution: max(H, W) // 2
      hidden_features: 64
      hidden_layers: 2
      output_activation: tanh
    train: {lr: 3.0e-2}  # deviation: 1e-2 in the reference

  TensoRF:
    class: TensoRF
    kwargs:
      rank: 176
      resolution: 256
      mode: cp
      hidden_features: 256
      hidden_layers: 2
      output_activation: tanh
    train: {lr: 3.0e-2}

  GA-Planes:
    class: GAPlanes
    kwargs:
      features: 26
      resolution: [256, 64]
      hidden_features: 256
      hidden_layers: 2
      output_activation: tanh
    train: {lr: 1.0e-2}

  F-INR:  # Vemuri et al. (WACV 2026): SIREN axes and CP, as in its image benchmark
    class: FINR
    kwargs:
      rank: 141  # a channel's rank is at most the width plus one in 2D
      hidden_features: 140  # deviation: 256 in the reference; 140 meets the budget
      hidden_layers: 3  # as the authors' public config
      mode: cp
      first_omega: 200.0  # deviation: tuned; the authors' image code has 100
      output_activation: tanh
    train: {lr: 1.0e-3}

  FUTON-sinc:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 280}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 64}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-cosine:
    class: FUTON
    kwargs:
      basis: [cosine, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 280}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 64}]
      output_activation: tanh
    train: {lr: 1.0e-1}
