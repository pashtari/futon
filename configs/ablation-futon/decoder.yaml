# FUTON ablation on the image task: the decoder, for the sinc and the Lanczos
# basis. The benchmark's one-layer MLP decoder 64 wide at CP rank 280 (197,379
# parameters) against MLPs 128 and 256 wide (-w128, -w256) and the paper's
# linear decoder (-linear), each at the largest rank within the image budget
# of 197,123: 256, 218 and 306.
#     python scripts/train_image.py --config configs/ablation-futon/decoder.yaml
# The data and training settings repeat configs/image.yaml.

data:
  subsample: 1.0

train:
  num_steps: 1000
  log_interval: 50
  eval_interval: 50
  seed: 0

models:
  FUTON-lanczos:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: [H // 2, W // 2], radius: 3, grid_size: [H, W]}]
      combiner: [cp, {rank: 280}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 64}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-sinc:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 280}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 64}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-lanczos-w128:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: [H // 2, W // 2], radius: 3, grid_size: [H, W]}]
      combiner: [cp, {rank: 256}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 128}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-sinc-w128:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 256}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 128}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-lanczos-w256:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: [H // 2, W // 2], radius: 3, grid_size: [H, W]}]
      combiner: [cp, {rank: 218}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 256}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-sinc-w256:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 218}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 256}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-lanczos-linear:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: [H // 2, W // 2], radius: 3, grid_size: [H, W]}]
      combiner: [cp, {rank: 306}]
      decoder: linear
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-sinc-linear:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 306}]
      decoder: linear
      output_activation: tanh
    train: {lr: 3.0e-2}
