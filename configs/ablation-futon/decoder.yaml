# FUTON ablation on the image task: the decoder, each at the largest CP rank
# within the image budget of 194,435 parameters. The paper's Eq. (9) ends in
# a linear decoder; the benchmark's one-layer MLP, 128 wide, is an extension
# that spends 32,771 of its 194,051 parameters there, 17% of the model. A
# linear decoder frees them for the combiner, rank 302, 194,189 parameters;
# MLPs 64 wide (-w64) and as wide as their rank (-w224), the width an MLP
# takes by default, hold ranks 275 and 224, 193,859 and 194,435 parameters.
#     python scripts/train_image.py --config configs/ablation-futon/decoder.yaml
# The data and training settings repeat configs/image.yaml.

data:
  subsample: 0.1

train:
  num_epochs: 2000
  log_interval: 100
  eval_interval: 100
  seed: 0

models:
  FUTON-lanczos:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: [H // 2, W // 2], radius: 3, grid_size: [H, W]}]
      combiner: [cp, {rank: 252}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 128}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-sinc:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 252}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 128}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-lanczos-w64:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: [H // 2, W // 2], radius: 3, grid_size: [H, W]}]
      combiner: [cp, {rank: 275}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 64}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-sinc-w64:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 275}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 64}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-lanczos-w224:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: [H // 2, W // 2], radius: 3, grid_size: [H, W]}]
      combiner: [cp, {rank: 224}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-sinc-w224:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 224}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-lanczos-linear:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: [H // 2, W // 2], radius: 3, grid_size: [H, W]}]
      combiner: [cp, {rank: 302}]
      decoder: linear
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-sinc-linear:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 302}]
      decoder: linear
      output_activation: tanh
    train: {lr: 3.0e-2}
