# FUTON ablation on the image task: the basis. Every basis at the benchmark's
# size, K = (H / 2, W / 2) components, CP rank 280 and a one-layer MLP decoder
# 64 wide, at the sinc basis's rate, 3e-2; the cosine basis keeps its own,
# 1e-1, as in configs/image.yaml.
#     python scripts/train_image.py --config configs/ablation-futon/basis.yaml
# The data and training settings repeat configs/image.yaml.

data:
  subsample: 1.0

train:
  num_steps: 1000
  log_interval: 50
  eval_interval: 50
  seed: 0

models:
  FUTON-cosine:
    class: FUTON
    kwargs:
      basis: [cosine, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 280}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 64}]
      output_activation: tanh
    train: {lr: 1.0e-1}

  FUTON-lanczos:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: [H // 2, W // 2], radius: 3, grid_size: [H, W]}]
      combiner: [cp, {rank: 280}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 64}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-sinc:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 280}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 64}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-triangle:
    class: FUTON
    kwargs:
      basis: [triangle, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 280}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 64}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-chebyshev:
    class: FUTON
    kwargs:
      basis: [chebyshev, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 280}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 64}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-legendre:
    class: FUTON
    kwargs:
      basis: [legendre, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 280}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 64}]
      output_activation: tanh
    train: {lr: 3.0e-2}
