# FUTON ablation on the image task: the components per axis, K = N/L for L in
# {4, 2, 1}, against the width of the one-layer MLP decoder, 16 to 256, each at
# the largest CP rank, a multiple of 5, that keeps FUTON smaller than every
# baseline (F-INR, 198,806), for the sinc and the cosine basis at their
# benchmark rates. N is the pixel grid. Model names carry L and the width:
# FUTON-sinc-N2-w64 is the benchmark's model.
#     python scripts/train_image.py \
#       --config configs/ablation-futon/components_width_image.yaml
# The data and training settings repeat configs/image.yaml.

data:
  subsample: 1.0  # the whole image at every step

train:
  num_steps: 1000
  log_interval: 50
  eval_interval: 50
  seed: 0

models:
  FUTON-sinc-N4-w16:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: [H // 4, W // 4], grid_size: [H, W]}]
      combiner: [cp, {rank: 590}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 16}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-sinc-N4-w32:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: [H // 4, W // 4], grid_size: [H, W]}]
