# FUTON ablation on the super-resolution task: the components per axis, K = N/L
# for L in {8, 4, 2, 1}, against the width of the one-layer MLP decoder, 16 to
# 256, each at the largest CP rank, a multiple of 5, that keeps FUTON smaller
# than every baseline (RFF, 500,007), for the sinc and the cosine basis at
# 1e-2. N is the high-resolution grid, whose quarter is the low-resolution
# image the model sees. Model names carry L and the width: FUTON-sinc-N4-w128
# is the benchmark's model. It runs on the three DIV2K training images every
# setting was tuned on, the benchmark's FUTON among them;
# `python scripts/download_div2k.py --training` fetches them.
#     python scripts/train_super_resolution.py \
#       --config configs/ablation-futon/components_width_super_resolution.yaml \
#       --data data/DIV2K/DIV2K_train_HR/0395.png data/DIV2K/DIV2K_train_HR/0431.png \
#         data/DIV2K/DIV2K_train_HR/0777.png
# The data and training settings repeat configs/super_resolution.yaml.

data:
  scale: 4
  # each step fits 135 blocks of 8 x 8 low-resolution pixels spread over the
  # image, whose footprints hold 261,360 high-resolution pixels, about 2^18
  num_blocks: 135  # blocks per step
  block_size: 8  # low-resolution pixels a side

train:
  num_steps: 1000
  log_interval: 50
  eval_interval: 50  # each evaluation renders and scores the whole image
  chunk_size: 262144  # pixels per evaluation forward pass
  seed: 0

models:
  FUTON-sinc-N8-w16:
    class: FUTON
    budget: 500006
    kwargs:
      basis: [sinc, {num_components: [H // 8, W // 8], grid_size: [H, W]}]
      combiner: [cp, {rank: budget}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 16}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-sinc-N8-w32:
    class: FUTON
    budget: 500006
    kwargs:
      basis: [sinc, {num_components: [H // 8, W // 8], grid_size: [H, W]}]
