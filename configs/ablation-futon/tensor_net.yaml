# FUTON ablation on the image task: a tensor-ring combiner (-TR) and a Tucker
# combiner (-Tucker) against the default CP one, for the lanczos and sinc bases
# at K = (H / 2, W / 2), each feeding the benchmark's one-layer MLP decoder,
# 128 wide, at the rank that comes closest to the CP model's 194,051
# parameters. Tensor-ring rank 16 has 16^2 = 256 features and 197,123
# parameters (rank 15 would have 173,315). Tucker takes a rank per axis in
# proportion to its components, R_c = gamma K_c with gamma = 0.161: (41, 61)
# on a 512 x 768 image, a 41 x 61 x 61 core whose 61 features feed the
# decoder, 194,804 parameters.
#     python scripts/train_image.py --config configs/ablation-futon/tensor_net.yaml
# The data and training settings repeat configs/image.yaml.

data:
  subsample: 0.1

train:
  num_epochs: 2000
  log_interval: 100
  eval_interval: 100
  seed: 0

models:
  FUTON-lanczos:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: [H // 2, W // 2], radius: 3, grid_size: [H, W]}]
      combiner: [cp, {rank: 252}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 128}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-sinc:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 252}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 128}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-lanczos-TR:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: [H // 2, W // 2], radius: 3, grid_size: [H, W]}]
      combiner: [tr, {rank: 16}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 128}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-sinc-TR:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [tr, {rank: 16}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 128}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-lanczos-Tucker:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: [H // 2, W // 2], radius: 3, grid_size: [H, W]}]
      combiner: [tucker, {rank: ["H // 2 * 161 // 1000", "W // 2 * 161 // 1000"]}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 128}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-sinc-Tucker:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [tucker, {rank: ["H // 2 * 161 // 1000", "W // 2 * 161 // 1000"]}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 128}]
      output_activation: tanh
    train: {lr: 3.0e-2}
