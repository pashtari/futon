# Super-resolution: recover each DIV2K validation image from its 4x bicubic
# downsampling, seeing only the low-resolution image.
#
# Each model gives a neurofield class, its constructor arguments, and training
# arguments that override the shared ones; an interpolation has only its
# method. Arguments may be expressions in the high-resolution height H and
# width W; the low-resolution image is H // 4 by W // 4. "deviation" marks a
# departure from the authors' published settings. Every learning rate is the
# best of the grid {1e-4, 3e-4, ..., 3e-1}, and every setting marked "tuned"
# the best of those tried, on three DIV2K training images (0395, 0431 and
# 0777); every model trains with PyTorch's default Adam.
#
# Every model has about 500k parameters, close to the 519k values of a
# 339 x 510 low-resolution image: each baseline is the smallest of its kind
# that reaches the budget, and FUTON takes the largest CP rank within it.

data:
  scale: 4
  # each step fits 135 blocks of 8 x 8 low-resolution pixels spread over the
  # image, whose footprints hold 261,360 high-resolution pixels, about 2^18
  num_blocks: 135  # blocks per step
  block_size: 8  # low-resolution pixels a side

train:
  num_steps: 1000
  log_interval: 50
  eval_interval: 50  # each evaluation renders and scores the whole image
  chunk_size: 262144  # pixels per evaluation forward pass
  seed: 0

models:
  Nearest:
    interpolation: nearest

  Bilinear:
    interpolation: bilinear

  Bicubic:  # the standard baseline; PIL's bicubic filter is MATLAB's
    interpolation: bicubic

  DIP:  # Ulyanov et al. (CVPR 2018), 4x super-resolution
    class: DIPSkip
    kwargs:
      in_channels: 32
      # deviation: 128 channels in the reference; 60 meet the budget
      down_channels: [60, 60, 60, 60, 60]
      up_channels: [60, 60, 60, 60, 60]
    train: {lr: 3.0e-3}

  RFF:  # Tancik et al. (NeurIPS 2020), 2D image regression
    class: RFF
    kwargs:
      hidden_features: 387
      hidden_layers: 3
      num_frequencies: 256
      sigma: 10.0  # tuned
      output_activation: tanh
    train: {lr: 3.0e-3}

  PE-MLP:  # FINER image benchmark
    class: PEMLP
    kwargs:
      hidden_features: 401
      hidden_layers: 4
      num_frequencies: 10  # tuned
      output_activation: tanh
    train: {lr: 3.0e-4}

  MFN:  # GaborNet (Fathony et al., ICLR 2021)
    class: MFN
    kwargs:
      hidden_features: 404
      hidden_layers: 4
      input_scale: 256.0  # tuned
      alpha: 1.25
      beta: 0.125
      weight_scale: 1.0
      output_activation: tanh
    train: {lr: 1.0e-2}

  SIREN:  # FINER image benchmark
    class: SIREN
    kwargs:
      hidden_features: 407
      hidden_layers: 4
      omega: 120.0  # tuned
      output_activation: tanh
    train: {lr: 1.0e-4}

  FreSh:  # Kania et al. (ICLR 2025): the SIREN above, its first omega chosen per image
    class: SIREN
    fresh: {size: 64}  # our adaptation: the spectrum of the low-resolution image
    kwargs:
      hidden_features: 407
      hidden_layers: 4
      omega: 120.0  # the later layers, as the SIREN above; FreSh picks the first one's
      output_activation: tanh
    train: {lr: 1.0e-4}

  Gauss:  # FINER image benchmark
    class: Gauss
    kwargs:
      hidden_features: 407
      hidden_layers: 4
      scale: 30.0  # tuned
      output_activation: tanh
    train: {lr: 1.0e-3}

  WIRE:  # FINER image benchmark, real Gabor layer
    class: RealWIRE
    kwargs:
      hidden_features: 408
      hidden_layers: 4
      omega: 10.0  # tuned
      scale: 10.0  # tuned
      output_activation: tanh
    train: {lr: 3.0e-3}

  FINER:  # FINER image benchmark
    class: FINER
    kwargs:
      hidden_features: 407
      hidden_layers: 4
      omega: 120.0  # tuned
      output_activation: tanh
    train: {lr: 1.0e-4}

  Instant-NGP:  # instant-ngp configs/image/base.json
    class: InstantNGP
    kwargs:
      num_levels: 17  # deviation: 16 in the reference; 17 meet the budget
      features_per_level: 2
      log2_hashmap_size: 15
      base_resolution: 16
      max_resolution: max(H, W) // 4  # tuned: the low-resolution grid
      hidden_features: 64
      hidden_layers: 2
      output_activation: tanh
    train: {lr: 3.0e-2}  # deviation: 1e-2 in the reference

  TensoRF:
    class: TensoRF
    kwargs:
      rank: 566
      resolution: max(H, W) // 8  # tuned: half the low-resolution grid
      mode: cp
      hidden_features: 256
      hidden_layers: 2
      output_activation: tanh
    train: {lr: 3.0e-2}

  GA-Planes:
    class: GAPlanes
    kwargs:
      features: 170
      resolution: ["max(H, W) // 4", 32]  # tuned: the low-resolution grid and a coarse plane
      hidden_features: 256
      hidden_layers: 2
      output_activation: tanh
    train: {lr: 1.0e-2}

  F-INR:  # Vemuri et al. (WACV 2026): SIREN axes and CP, as in its image benchmark
    class: FINR
    kwargs:
      rank: 224  # a channel's rank is at most the width plus one in 2D
      hidden_features: 223  # deviation: 256 in the reference; 223 meets the budget
      hidden_layers: 3  # as the authors' public config
      mode: cp
      output_activation: tanh
    train: {lr: 3.0e-4}

  FUTON-sinc:
    class: FUTON
    budget: 500000  # parameters; "budget" below is the largest rank within it
    kwargs:
      # one basis function per low-resolution pixel along each axis
      basis: [sinc, {num_components: [H // 4, W // 4], grid_size: [H, W]}]
      combiner: [cp, {rank: budget}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 64}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-cosine:
    class: FUTON
    budget: 500000
    kwargs:
      basis: [cosine, {num_components: [H // 4, W // 4], grid_size: [H, W]}]
      combiner: [cp, {rank: budget}]
      decoder: [mlp, {hidden_layers: 1, hidden_features: 64}]
      output_activation: tanh
    train: {lr: 1.0e-2}
